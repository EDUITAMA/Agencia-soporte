stages:
  - validate
  - test
  - build
  - publish
  - deploy

.node-job:
  image: node:22-bookworm-slim
  before_script:
    - npm ci
    - npm ci --prefix apps/backend
    - npm ci --prefix apps/frontend/angular-app

validate:
  extends: .node-job
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm run validate

test:
  extends: .node-job
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm run test:all

build:
  extends: .node-job
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm run build:all
    - npm run smoke:backend
  artifacts:
    paths:
      - apps/backend/dist/
      - apps/frontend/angular-app/dist/
    expire_in: 2 hours

publish-template:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: false
  script:
    - test -n "${TODO_DEPLOY_URL:-}" || { echo "Set TODO_DEPLOY_URL before enabling publish."; exit 1; }
    - echo "Replace this template with the approved artifact publication command."

deploy-template:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: false
  needs:
    - build
  script:
    - test -n "${TODO_DEPLOY_URL:-}" || { echo "Set TODO_DEPLOY_URL before enabling deploy."; exit 1; }
    - test -n "${TODO_DEPLOY_TOKEN:-}" || { echo "Set TODO_DEPLOY_TOKEN before enabling deploy."; exit 1; }
    - test -n "${TODO_DEPLOY_CERTIFICATE:-}" || { echo "Set TODO_DEPLOY_CERTIFICATE before enabling deploy."; exit 1; }
    - test -n "${TODO_BACKEND_START_COMMAND:-}" || { echo "Set TODO_BACKEND_START_COMMAND before enabling deploy."; exit 1; }
    - echo "Replace this template with approved host-specific deployment commands."
